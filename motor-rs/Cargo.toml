[package]
name = "motor-rs"
version = "0.1.0"
edition = "2021"
description = "Motor de render do Solrac Estudio sem navegador (paralelo ao Remotion, experimental)"

[dependencies]
tiny-skia = "0.11"
ab_glyph = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
wgpu = "22"
pollster = "0.3"
bytemuck = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
